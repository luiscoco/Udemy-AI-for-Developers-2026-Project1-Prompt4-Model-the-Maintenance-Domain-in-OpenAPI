openapi: 3.0.3
info:
  title: Equipment Maintenance Hub API
  description: >
    Internal maintenance operations API for tracking equipment work orders
    through their lifecycle, from initial report through completion.
  version: 0.1.0
paths: {}
components:
  schemas:
    WorkOrderState:
      type: string
      description: >
        Current stage of a work order in its lifecycle. Transitions are
        driven by WorkOrderAction commands.
      enum:
        - reported
        - triaged
        - scheduled
        - in_progress
        - completed
        - cancelled

    WorkOrderAction:
      type: string
      description: Command used to transition a work order from one state to another.
      enum:
        - triage
        - schedule
        - start
        - complete
        - cancel

    Priority:
      type: string
      description: Urgency level assigned to a work order.
      enum:
        - low
        - medium
        - high
        - critical

    Asset:
      type: object
      description: A piece of equipment that can be the subject of a work order.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the asset.
        tag:
          type: string
          description: Human-readable asset tag printed on the physical equipment.
        name:
          type: string
          description: Descriptive name of the asset.
        location:
          type: string
          description: Physical location of the asset (e.g. building, room, line).
      required:
        - id
        - tag
        - name
        - location

    Technician:
      type: object
      description: A maintenance technician who can be assigned to work orders.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the technician.
        name:
          type: string
          description: Full name of the technician.
        specialty:
          type: string
          description: Primary area of expertise (e.g. electrical, mechanical, HVAC).
      required:
        - id
        - name
        - specialty

    WorkOrder:
      type: object
      description: A maintenance task tracked from report to completion.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the work order.
        reference:
          type: string
          description: Human-readable reference code (e.g. WO-2026-00042).
        assetId:
          type: string
          format: uuid
          description: Identifier of the asset this work order applies to.
        title:
          type: string
          description: Short summary of the maintenance task.
        description:
          type: string
          description: Detailed description of the issue or task.
        priority:
          $ref: '#/components/schemas/Priority'
        state:
          $ref: '#/components/schemas/WorkOrderState'
        technicianId:
          type: string
          format: uuid
          nullable: true
          description: Identifier of the technician assigned to this work order, if any.
        reportedAt:
          type: string
          format: date-time
          description: Timestamp when the work order was first reported.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the work order was last updated.
      required:
        - id
        - reference
        - assetId
        - title
        - description
        - priority
        - state
        - technicianId
        - reportedAt
        - updatedAt

    NewWorkOrder:
      type: object
      description: Payload for reporting a new work order.
      properties:
        assetId:
          type: string
          format: uuid
          description: Identifier of the asset this work order applies to.
        title:
          type: string
          description: Short summary of the maintenance task.
        description:
          type: string
          description: Detailed description of the issue or task.
        priority:
          $ref: '#/components/schemas/Priority'
      required:
        - assetId
        - title
        - description
        - priority

    TransitionCommand:
      type: object
      description: Command to move a work order to its next lifecycle state.
      properties:
        action:
          $ref: '#/components/schemas/WorkOrderAction'
      required:
        - action

    AssignmentCommand:
      type: object
      description: Command to assign a technician to a work order.
      properties:
        technicianId:
          type: string
          format: uuid
          description: Identifier of the technician to assign.
      required:
        - technicianId

    DashboardSummary:
      type: object
      description: Aggregate counts of work orders for the operations dashboard.
      properties:
        totalOpen:
          type: integer
          description: Total number of work orders not yet completed or cancelled.
        criticalOpen:
          type: integer
          description: Number of open work orders with critical priority.
        unassigned:
          type: integer
          description: Number of open work orders with no technician assigned.
        byState:
          type: object
          description: Count of work orders grouped by state.
          additionalProperties:
            type: integer
      required:
        - totalOpen
        - criticalOpen
        - unassigned
        - byState

    ApiError:
      type: object
      description: Standard error response shape.
      properties:
        message:
          type: string
          description: Human-readable error message.
        details:
          type: object
          description: Optional additional error context.
          additionalProperties: true
      required:
        - message
